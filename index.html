<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задание Гильдии</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; padding: 20px; background: #1e1e1e; color: white; font-family: sans-serif; text-align: center; }
        h3 { margin-bottom: 10px; }
        .instruction { background: #2c2c2c; padding: 15px; border-radius: 10px; margin: 15px 0; font-size: 14px; }
        .timer { font-size: 48px; font-weight: bold; margin: 10px 0; color: #FFD700; }
        button { padding: 12px; margin: 8px 0; border: none; border-radius: 10px; font-weight: bold; width: 90%; max-width: 300px; }
        .goto-btn { background: #E1306C; color: white; }
        .done-btn { background: #555; color: #aaa; }
        .done-btn.active { background: #4CAF50; color: white; }
        .bonus-section { text-align: left; background: #2c2c2c; padding: 15px; border-radius: 10px; margin-top: 20px; }
        .bonus-section label { display: block; padding: 8px 0; font-size: 16px; }
        .bonus-section input[type="checkbox"] { margin-right: 10px; }
        .comment-input { width: 90%; padding: 10px; margin-top: 5px; border-radius: 5px; border: none; display: none; }
        .note { font-size: 12px; color: #aaa; margin-top: 15px; }
    </style>
</head>
<body>
    <h3>🎯 Задание Гильдии</h3>
    <div class="instruction">
        <p>1. Нажми <b>«Перейти к видео»</b></p>
        <p>2. Посмотри <b>15 секунд</b> (не закрывая окно)</p>
        <p>3. Отметь доп. действия и нажми <b>«Подтвердить»</b></p>
    </div>
    <div class="timer" id="timerDisplay">15</div>
    <p style="font-size:14px;">секунд до разблокировки</p>
    <button class="goto-btn" id="gotoBtn">📱 Перейти к видео</button>

    <div class="bonus-section">
        <p style="font-weight:bold;">🔥 Бонусные действия:</p>
        <label><input type="checkbox" id="likeCheck"> 👍 Лайкнул (+1 🔮)</label>
        <label><input type="checkbox" id="commentCheck"> 💬 Написал комментарий (+2 🔮)</label>
        <input type="text" id="commentText" class="comment-input" placeholder="Введи оставленный комментарий">
        <label><input type="checkbox" id="saveCheck"> 🔖 Сохранил (+1 🔮)</label>
    </div>

    <button class="done-btn" id="doneBtn" disabled>✅ Подтверждаю просмотр</button>
    <p class="note">После подтверждения ты получишь кристаллы.</p>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const params = new URLSearchParams(window.location.search);
        const videoUrl = params.get('url');
        const taskId = params.get('task_id');

        const gotoBtn = document.getElementById('gotoBtn');
        const doneBtn = document.getElementById('doneBtn');
        const timerDisplay = document.getElementById('timerDisplay');
        const likeCheck = document.getElementById('likeCheck');
        const commentCheck = document.getElementById('commentCheck');
        const commentText = document.getElementById('commentText');
        const saveCheck = document.getElementById('saveCheck');

        let secondsLeft = 15;
        let canSubmit = false;

        // Показываем поле комментария только если отмечен чекбокс
        commentCheck.addEventListener('change', () => {
            commentText.style.display = commentCheck.checked ? 'block' : 'none';
        });

        gotoBtn.addEventListener('click', () => {
            if (videoUrl) {
                window.open(videoUrl, '_blank');
                gotoBtn.disabled = true;
                gotoBtn.innerText = '⏳ Видео открыто. Жди...';
                startTimer();
            } else {
                alert('Ошибка: ссылка не указана');
            }
        });

        function startTimer() {
            const interval = setInterval(() => {
                secondsLeft--;
                timerDisplay.textContent = secondsLeft;
                if (secondsLeft <= 0) {
                    clearInterval(interval);
                    canSubmit = true;
                    doneBtn.disabled = false;
                    doneBtn.classList.add('active');
                    timerDisplay.textContent = '0';
                    timerDisplay.style.color = '#4CAF50';
                }
            }, 1000);
        }

        doneBtn.addEventListener('click', () => {
            if (!canSubmit) return;

            const actions = [];
            if (likeCheck.checked) actions.push('like');
            if (saveCheck.checked) actions.push('save');
            if (commentCheck.checked) {
                const cmt = commentText.value.trim();
                if (cmt) {
                    actions.push('comment');
                    // Сохраним комментарий для передачи
                } else {
                    alert('Ты отметил комментарий, но не написал текст. Впиши его, пожалуйста.');
                    return;
                }
            }

            // Подготавливаем данные для бота
            const payload = {
                task_id: taskId,
                action: 'done',
                bonuses: actions,
                comment_text: commentCheck.checked ? commentText.value.trim() : ''
            };
            tg.sendData(JSON.stringify(payload));
            tg.close();
        });
    </script>
</body>
</html>
