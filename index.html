<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Просмотр задания</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; padding: 10px; background: #1e1e1e; color: white; font-family: sans-serif; text-align: center; }
        video { width: 100%; max-height: 60vh; border-radius: 10px; }
        button { padding: 12px 30px; font-size: 16px; margin-top: 20px; border: none; border-radius: 8px; background: #555; color: white; }
        button.active { background: #4CAF50; }
    </style>
</head>
<body>
    <h3>🎬 Задание от гильдии</h3>
    <video id="video" controls>
        <source src="" type="video/mp4">
        Ваш браузер не поддерживает видео.
    </video>
    <p id="timer">Досмотри видео до конца</p>
    <button id="doneBtn" disabled>✅ Я посмотрел</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Раскрыть на весь экран

        // Получаем ссылку из параметра
        const params = new URLSearchParams(window.location.search);
        const videoUrl = params.get('url');
        const taskId = params.get('task_id');

        const video = document.getElementById('video');
        const doneBtn = document.getElementById('doneBtn');
        const timerText = document.getElementById('timer');

        if (videoUrl) {
            video.src = videoUrl;
            video.load();
        } else {
            timerText.innerText = '❌ Ссылка не указана';
        }

        // Кнопка активна после 15 секунд просмотра
        let canConfirm = false;
        video.addEventListener('timeupdate', () => {
            if (!canConfirm && video.currentTime >= 15) {
                canConfirm = true;
                doneBtn.disabled = false;
                doneBtn.classList.add('active');
                doneBtn.innerText = '✅ Подтверждаю просмотр';
                timerText.innerText = 'Можешь подтвердить';
            }
        });

        doneBtn.addEventListener('click', () => {
            if (!canConfirm) return;
            // Отправляем данные обратно боту
            tg.sendData(JSON.stringify({ task_id: taskId, action: 'done' }));
            tg.close();
        });
    </script>
</body>
</html>
